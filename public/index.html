<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Project Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Student Project Tracker</h1>
      <p>Name: Anusha M Woodi</p>
      <p>SRN:R25EP010</p>
      <p>Branch:Electronics and computer engineering</p>
      <p>Track our electronics project ideas.</p>
    </header>

    <section aria-labelledby="form-title">
      <h2 id="form-title">Add or edit a project</h2>
      <form id="project-form">
        <label for="name">Project name</label>
        <div id="project-name-picker">
          <input id="name" name="name" type="text" autocomplete="off" required maxlength="80">
          <div id="project-name-options" role="listbox" aria-label="Existing project names" hidden></div>
        </div>

        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="Planned">Planned</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>

        <button id="save-button" type="submit">Save project</button>
        <button id="cancel-button" type="button" hidden>Cancel</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Projects</h2>
      <p id="empty-state">No projects yet.</p>
      <ul id="project-list"></ul>
    </section>
  </main>
</body>
</html>
